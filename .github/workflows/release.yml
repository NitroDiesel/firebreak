name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS and WiX
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE ".dotnet\tools"
          & (Join-Path $tools "wix.exe") extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          $tools >> $env:GITHUB_PATH

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -notmatch 'version\s*=\s*"([^"]+)"') { throw "No version in Cargo.toml" }
            $version = $Matches[1]
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build setup, MSI, and portable zip
        shell: pwsh
        run: ./installer/build.ps1
        env:
          FIREBREAK_VERSION: ${{ steps.version.outputs.version }}

      # A manual run only builds, so installer changes can be tried before a release.
      - name: Keep the build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: firebreak-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Firebreak ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          body: |
            Firebreak, a Windows firewall based on simplewall by Henry++.
            - `firebreak-${{ steps.version.outputs.version }}-setup.exe` is the installer. Most people want this one.
            - `firebreak-${{ steps.version.outputs.version }}-setup.msi` is the Windows Installer package, for Group Policy, Intune, or `msiexec /i ... /qn`.
            - `firebreak-${{ steps.version.outputs.version }}-bin.zip` is the portable build. Put an empty `firebreak.ini` next to `firebreak.exe` to keep the profile in that folder.

            Both installers put Firebreak in `C:\Program Files\Firebreak`, beside the original simplewall, and close a running copy first. They replace simplewall (Rust) 3.9.x, and its settings, startup task, and skip-UAC task carry over. Install with either the .exe or the .msi, not both. Uninstalling leaves filters in place, so turn filtering off in the app first.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
